[package]
name = "session-store"
version.workspace = true
edition.workspace = true

[dependencies]
appstore-service = { path = "../appstore-service" }
manifest-registry = { path = "../manifest-registry" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
tempfile = "3"
tokio = { workspace = true, features = ["rt"] }
url = "2"
